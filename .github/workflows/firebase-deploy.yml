# Deploys the Congregation Cart Program to Firebase Hosting.
#
# Runs automatically on every push to main — including edits made straight from
# the GitHub website — so the live site updates itself a minute or two later.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the Firebase tools
        run: npm install -g firebase-tools

      # Checks the secrets first and says plainly what is wrong, instead of
      # failing later with a confusing "have you run firebase login?".
      - name: Check the secrets are set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          fail=0
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing or empty."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Paste the WHOLE service-account .json file, including the outer { }."
            fail=1
          else
            printf '%s' "$SA" > /tmp/sa.json
            if ! python3 -c "import json,sys; json.load(open('/tmp/sa.json'))" 2>/dev/null; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON."
              echo "It must be the entire .json file contents, not a path or a fragment."
              fail=1
            else
              echo "Service account JSON parsed OK."
              python3 -c "import json;d=json.load(open('/tmp/sa.json'));print('  client_email:',d.get('client_email','MISSING'));print('  project_id  :',d.get('project_id','MISSING'));print('  type        :',d.get('type','MISSING'))"
            fi
          fi
          if [ -z "$PID" ]; then
            echo "::error::Secret FIREBASE_PROJECT_ID is missing or empty (for example: cart-program)."
            fail=1
          else
            echo "Project id secret is set."
          fi
          exit $fail

      # Stamps this build's id into the page and a tiny version file beside it.
      # The running app polls that file and offers a refresh when they differ.
      - name: Stamp the build version
        run: |
          VER="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M)"
          echo "Build version: $VER"
          printf '{"version":"%s"}\n' "$VER" > public/version.json
          sed -i "s|__BUILD_VERSION__|$VER|g" public/index.html

      - name: Deploy hosting and security rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          printf '%s' "$SA" > /tmp/sa.json
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive
          rm -f /tmp/sa.json
